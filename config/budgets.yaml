# PRD 19.6 / 22.2. USD caps stay null until the NO_SKILL baseline is measured (25.1 step 0).
# null cap => no USD gate, but run-count caps still apply (never treat unknown cost as free).
budgets:
  per_call_max_usd: null        # -> claude -p --max-budget-usd
  per_suite_max_usd: null       # -> claude plugin eval --max-cost-usd
  nightly_max_usd: null
  daily_max_usd: null
  nightly_max_agent_runs: 117   # profile S guard. 30->100->117 on 2026-11-20: eunhye approved the 10x3x3 (90 runs) campaign;
                                # +17 = exactly the campaign runs left after earlier same-night runs used the window
  soft_limit_ratio: 0.8
  hard_limit_ratio: 1.0
  smoke_test_max_usd: 0.5       # cap for the one-off harness smoke test
