# PRD F1 / 5.2: daily SKILL.md collection. No LLM, no Claude subscription/API key needed.
name: collect-skills
on:
  schedule:
    - cron: "17 22 * * *"   # 22:17 UTC = 07:17 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-skills
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_collector.py tests/test_security_gates.py
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read from env only, never written to disk
        run: python -m lab.collector --export data/skills.json
      # data/lab.db (SQLite, a few MB) is the system of record: append-only skill_versions history
      # cannot be rebuilt from skills.json, so git versions the DB itself (PRD 7: "JSON + Git").
      # Move it to a release asset / object store if it outgrows a few tens of MB.
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab.db data/skills.json data/reports/
          git diff --cached --quiet || git commit -m "collect: $(date -u +%F)"
          git push
